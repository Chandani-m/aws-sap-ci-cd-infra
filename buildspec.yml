version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11

  build:
    commands:
      - echo "Deploying CloudFormation stack..."
      - aws cloudformation deploy \
          --template-file template.yaml \
          --stack-name my-cf-stack \
          --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
          --region ap-south-1

artifacts:
  files:
    - template.yaml
